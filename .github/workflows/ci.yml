name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Optional branch, tag, or SHA to validate"
        required: false
        default: ""
        type: string
      skip_release_bundle:
        description: "Skip the nested bundle smoke when the caller will build it next"
        required: false
        default: false
        type: boolean

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - id: version
        shell: bash
        run: |
          value="$(tr -d '[:space:]' < VERSION)"
          [[ "${value}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=v${value}" >> "${GITHUB_OUTPUT}"

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python3 -m pip install jsonschema

      - name: Validate release metadata and neutral layout
        shell: bash
        run: |
          python3 scripts/sync-readme-version.py --check
          test -d agents
          test -d protocols
          test -d skills
          test -d tools/status-runtime
          test -f modes.json
          test ! -e opencode
          test ! -L opencode
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert version.count(".") == 2
          modes = json.loads(Path("modes.json").read_text(encoding="utf-8"))
          assert modes["version"] == 1 and modes["modes"]
          assert all(mode["agent"] != "orchestrator-goal" for mode in modes["modes"])
          PY

      - name: Validate Python contracts and tests
        shell: bash
        run: |
          python3 -m compileall -q scripts tools
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/validate-orchestrator-contracts.py
          python3 scripts/validate-helper-contracts.py
          python3 scripts/validate-reviewer-retry-guidance.py
          python3 scripts/validate-status-emission-guidance.py
          python3 scripts/validate-skill-frontmatter.py
          python3 scripts/update-agent-model-sets.py --check

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          actionlint_version="1.7.12"
          archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${archive}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "${temp_dir}"' EXIT
          curl -fsSL "${url}" -o "${temp_dir}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${temp_dir}/${archive}" | sha256sum -c -
          tar -xzf "${temp_dir}/${archive}" -C "${temp_dir}" actionlint
          "${temp_dir}/actionlint" -color

      - name: Validate schemas and fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          tool = [sys.executable, "tools/validate-schema.py", "--require-jsonschema"]
          positive = [
              ("dev-spec.schema.json", "dev-spec.valid.json"),
              ("dispatch-plan.schema.json", "dispatch-plan.resource.valid.json"),
              ("flow-task-list.schema.json", "flow-task-list.valid.json"),
              ("handoff-pack.schema.json", "handoff-pack.valid.json"),
              ("modernize-exec-handoff.schema.json", "modernize-exec-handoff.valid.json"),
              ("task-list.schema.json", "task-list.trace.valid.json"),
              ("ui-ux-bundle.schema.json", "ui-ux-bundle.valid.json"),
              ("problem-spec.schema.json", "spec-to-pipeline/problem-spec.json"),
              ("dev-spec.schema.json", "spec-to-pipeline/dev-spec.json"),
              ("plan-outline.schema.json", "spec-to-pipeline/plan-outline.json"),
              ("task-list.schema.json", "spec-to-pipeline/task-list.json"),
          ]
          negative = [
              ("dev-spec.schema.json", "dev-spec.invalid.json"),
              ("dispatch-plan.schema.json", "dispatch-plan.resource.invalid.json"),
              ("dispatch-plan.schema.json", "dispatch-plan.browser-unsafe.invalid.json"),
              ("dispatch-plan.schema.json", "dispatch-plan.process-unsafe.invalid.json"),
              ("dispatch-plan.schema.json", "dispatch-plan.server-no-teardown.invalid.json"),
              ("flow-task-list.schema.json", "flow-task-list.high-risk-weak-controls.invalid.json"),
              ("modernize-exec-handoff.schema.json", "modernize-exec-handoff.invalid.json"),
              ("task-list.schema.json", "task-list.trace.invalid.json"),
          ]
          for schema, fixture in positive:
              subprocess.run(tool + ["--schema", f"protocols/schemas/{schema}", "--input", f"protocols/examples/{fixture}"], check=True)
          for schema, fixture in negative:
              result = subprocess.run(tool + ["--schema", f"protocols/schemas/{schema}", "--input", f"protocols/examples/{fixture}"])
              if result.returncode == 0:
                  raise SystemExit(f"Expected invalid fixture to fail: {fixture}")

          status_positive = [
              ("run-status.schema.json", "status-layout.run-only.valid/run-status.json"),
              ("run-status.schema.json", "status-layout.expanded.valid/run-status.json"),
              ("task-status.schema.json", "status-layout.expanded.valid/tasks/task-doc-summary.json"),
              ("task-status.schema.json", "status-layout.expanded.valid/tasks/task-process-build.json"),
              ("task-status.schema.json", "status-layout.expanded.valid/tasks/task-local-server-smoke.json"),
              ("task-status.schema.json", "status-layout.expanded.valid/tasks/task-browser-resume.json"),
              ("agent-status.schema.json", "status-layout.expanded.valid/agents/agent-doc-01.json"),
              ("agent-status.schema.json", "status-layout.expanded.valid/agents/agent-process-01.json"),
              ("agent-status.schema.json", "status-layout.expanded.valid/agents/agent-server-01.json"),
              ("agent-status.schema.json", "status-layout.expanded.valid/agents/agent-browser-02.json"),
              ("agent-status.schema.json", "status-layout.expanded.valid/agents/agent-scout-01.json"),
          ]
          status_negative = [
              ("run-status.schema.json", "status-layout.contract.invalid/run-status.json"),
              ("task-status.schema.json", "status-layout.contract.invalid/tasks/task-browser-cleanup-invalid.json"),
              ("agent-status.schema.json", "status-layout.contract.invalid/agents/agent-browser-cleanup-invalid.json"),
          ]
          for schema, fixture in status_positive:
              subprocess.run(tool + ["--schema", f"protocols/schemas/{schema}", "--input", f"protocols/examples/{fixture}"], check=True)
          for schema, fixture in status_negative:
              result = subprocess.run(tool + ["--schema", f"protocols/schemas/{schema}", "--input", f"protocols/examples/{fixture}"])
              if result.returncode == 0:
                  raise SystemExit(f"Expected invalid status fixture to fail: {fixture}")
          subprocess.run(tool + ["--schema", "protocols/schemas/todo-ledger.schema.json", "--input", "todo-ledger.example.json"], check=True)
          PY

      - name: Validate runtime exporters and installers
        shell: bash
        run: |
          python3 scripts/export-codex-agents.py --source-agents agents --target-dir .tmp-codex --strict --dry-run
          python3 scripts/export-claude-agents.py --source-agents agents --target-dir .tmp-claude --strict --dry-run
          python3 scripts/export-copilot-agents.py --source-agents agents --target-dir .tmp-copilot --strict --dry-run
          bash -n scripts/install-codex.sh
          bash -n scripts/install-claude.sh
          bash -n scripts/install-copilot.sh
          bash -n scripts/agent-profile.sh
          bash -n scripts/bootstrap-install-codex.sh
          bash -n scripts/bootstrap-install-claude.sh
          bash -n scripts/bootstrap-install-copilot.sh
          bash scripts/install-codex.sh --target .tmp-install-codex --dry-run --no-backup
          bash scripts/install-claude.sh --target .tmp-install-claude --dry-run --no-backup
          bash scripts/install-copilot.sh --target .tmp-install-copilot --dry-run --no-backup
          python3 tools/agent-profile.py list --runtime codex --json >/dev/null

      - name: Validate neutral status writer
        shell: bash
        run: |
          node --check tools/status-event.js
          node --test tests/status-runtime.test.js
          node scripts/validate-status-runtime-smoke.cjs

      - name: Validate local-preview lifecycle
        run: node scripts/validate-local-preview-lifecycle-smoke.cjs

  validate-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Validate PowerShell runtime installers
        shell: pwsh
        run: |
          [void](Get-Command ./scripts/install-codex.ps1)
          [void](Get-Command ./scripts/install-claude.ps1)
          [void](Get-Command ./scripts/install-copilot.ps1)
          [void](Get-Command ./scripts/agent-profile.ps1)
          [void](Get-Command ./scripts/bootstrap-install-codex.ps1)
          [void](Get-Command ./scripts/bootstrap-install-claude.ps1)
          [void](Get-Command ./scripts/bootstrap-install-copilot.ps1)
          pwsh -NoProfile -File scripts/install-codex.ps1 -Target .tmp-install-codex -DryRun -NoBackup
          pwsh -NoProfile -File scripts/install-claude.ps1 -Target .tmp-install-claude -DryRun -NoBackup
          pwsh -NoProfile -File scripts/install-copilot.ps1 -Target .tmp-install-copilot -DryRun -NoBackup
          Invoke-Pester -Path @(
            "tests/install-codex.Tests.ps1",
            "tests/install-runtime-profiles.Tests.ps1"
          ) -CI

  validate-preview-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Validate macOS Bash installer and workspace profile
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/agents-pipeline.XXXXXX")"
          trap 'rm -rf "${smoke_root}"' EXIT
          export HOME="${smoke_root}/home"
          workspace="${smoke_root}/workspace"
          mkdir -p "${HOME}" "${workspace}"

          bash scripts/install-codex.sh --no-backup >/dev/null
          profile_tool="${HOME}/.codex/agents-pipeline/scripts/agent-profile.sh"
          global_status_json="$(bash "${profile_tool}" status \
            --runtime codex \
            --scope global \
            --json 2>/dev/null)"
          GLOBAL_STATUS_JSON="${global_status_json}" python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          status = json.loads(os.environ["GLOBAL_STATUS_JSON"])
          assert status["health"] == "ok", status
          assert status["mode"] == "inherit", status
          assert status["profile"] is None, status
          assert status["model_set"] is None, status
          roles = sorted((Path.home() / ".codex" / "agents").glob("*.toml"))
          assert len(roles) == 45, roles
          for role_path in roles:
              with role_path.open("rb") as handle:
                  role = tomllib.load(handle)
              assert "model" not in role, role_path
              assert "model_provider" not in role, role_path
          PY
          bash "${profile_tool}" set balanced \
            --runtime codex \
            --scope workspace \
            --workspace "${workspace}" \
            --model-set openai \
            --no-backup >/dev/null
          status_json="$(bash "${profile_tool}" status \
            --runtime codex \
            --scope workspace \
            --workspace "${workspace}" \
            --json 2>/dev/null)"

          STATUS_JSON="${status_json}" WORKSPACE="${workspace}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(os.environ["STATUS_JSON"])
          workspace = Path(os.environ["WORKSPACE"])
          assert status["health"] == "ok", status
          assert status["profile_eligibility"] == "ineligible", status
          assert len(list((workspace / ".codex" / "agents").glob("*.toml"))) == 45
          assert not (workspace / ".codex" / "agents-pipeline").exists()
          PY
          test "$(find "${HOME}/.agents/skills" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | wc -l | tr -d ' ')" -eq 10
          test ! -e "${HOME}/.agents/skills/run-goal"
      - run: node scripts/validate-local-preview-lifecycle-smoke.cjs

  validate-minimum-runtimes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
      - name: Validate minimum supported runtimes
        shell: bash
        run: |
          python3 -m pip install jsonschema
          python3 -m compileall -q scripts tools
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/status-runtime.test.js
          node scripts/validate-status-runtime-smoke.cjs

  validate-release-bundle:
    if: ${{ !inputs.skip_release_bundle }}
    needs: [version, validate]
    uses: ./.github/workflows/release-bundle.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.version.outputs.tag }}
      checkout_tag: false
